<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Deadline – Trust. Commit. Deliver.</title><link rel="icon" id="fv">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f6fd;--card:#fff;--ink:#041848;--mut:#58698f;--line:#dce5f5;--pri:#041b57;--pri2:#0540ff;--acc:#2f7bff;--ok:#0f9d68;--warn:#c98a00;--bad:#e5484d;--sh:0 8px 28px rgba(4,27,87,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050c22;--card:#0c1840;--ink:#eaf0ff;--mut:#93a4d4;--line:#1b2c5e;--pri:#1d44c9;--pri2:#4d7dff;--acc:#5b8cff;--sh:0 8px 28px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050c22;--card:#0c1840;--ink:#eaf0ff;--mut:#93a4d4;--line:#1b2c5e;--pri:#1d44c9;--pri2:#4d7dff;--acc:#5b8cff;--sh:0 8px 28px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.w{max-width:1000px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(115deg,#031447,#041b57 50%,#0540ff 135%);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:var(--sh)}
.logo{font-weight:800;font-size:26px;letter-spacing:.3px;line-height:1}.logo i{color:#ffb15c;font-style:normal}.sub{font-size:12px;opacity:.85;margin-top:4px}
.sp{flex:1}.seg{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px}
.seg button,.tb{border:0;background:none;color:#fff;padding:6px 13px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.seg .on{background:#fff;color:#041b57;font-weight:600}.tb{background:rgba(255,255,255,.18)}
nav{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
nav button{flex:1;min-width:88px;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:10px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer}
nav .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:12px}
.k{font-size:12px;color:var(--mut)}.v{font-size:28px;font-weight:800;line-height:1.2}h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.btn{border:0;background:var(--pri2);color:#fff;padding:9px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}.btn.a{background:var(--acc)}.btn.r{background:var(--bad)}.btn[disabled]{opacity:.35;cursor:not-allowed}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--mut)}
.pill.ok{background:rgba(15,157,104,.16);color:var(--ok)}.pill.w{background:rgba(245,130,32,.18);color:var(--warn)}.pill.b{background:rgba(229,72,77,.16);color:var(--bad)}.pill.i{background:rgba(5,64,255,.14);color:var(--pri2)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--acc));transition:width .6s}
.ms{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:800;flex:none}.dot.ok{background:var(--ok);color:#fff}
.log{font-size:13px;color:var(--mut)}.log div{padding:7px 0;border-top:1px dashed var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.cl{cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;font:inherit;margin-bottom:8px}.cl.on{border-color:var(--pri2);box-shadow:0 0 0 2px var(--pri2) inset}
.ring{width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}.ring div{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:34px;line-height:1}.ring small{display:block;font-size:11px;font-weight:600;color:var(--mut);text-align:center}
.tr{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
.note{font-size:12px;color:var(--mut);margin-top:14px}
.mdl{position:fixed;inset:0;background:rgba(10,6,30,.62);display:grid;place-items:center;padding:16px;z-index:20}.mdl .card{max-width:420px;width:100%}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit;margin-bottom:6px;cursor:pointer}.op.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
code{font-size:11px;background:var(--bg);padding:1px 5px;border-radius:6px;color:var(--pri2)}
@media(prefers-reduced-motion:reduce){.bar b{transition:none}}
#hl{height:40px!important;width:auto;max-width:180px;object-fit:contain}.brand-link{display:flex;align-items:center;border-radius:16px}.brand-link:focus-visible{outline:2px solid var(--pri);outline-offset:3px}@media(max-width:560px){#hl{height:30px!important;max-width:145px}}

function verCard(a){const v=a.ver,ks=a.type=='Business'?['email','aad','pan','addr','gst']:['email','aad','pan','addr'],cur=ks.find(k=>!v[k]),T={email:['Email','Confirm with a 6-digit code'],aad:['Aadhaar','Identity through OTP-based eKYC'],pan:['PAN','Tax identity'],addr:['Address','City and pincode'],gst:['GSTIN','Makes you a verified business']};
const fl=(k,p)=>`<input data-f='au.${k}' placeholder="${p}" value="${esc(AU[k]||'')}" style='margin-top:6px' autocomplete='off'>`,ot=`<div class='row'><button class='btn o' data-a='sotp'>Send code</button>${a.otp?`<span class='pill w'>Demo inbox: ${a.otp}</span>`:''}</div>${fl('o','6-digit code')}`,F={email:ot,aad:fl('aad','12-digit Aadhaar (sample number only)')+ot,pan:fl('pan','ABCDE1234F'),addr:fl('ad','Address line')+fl('pin','Pincode')+fl('city','City'),gst:fl('gst','15-character GSTIN')};
return`<div class='card'><h3>Verification</h3><div class='k'>${lv(a)[0]}. Email, Aadhaar and PAN are needed before you can move money.</div>${ks.map(k=>`<div class='ms' style='padding:10px 0'><div class='dot ${v[k]?'ok':''}'>${v[k]?'✓':''}</div><div style='flex:1'><b>${T[k][0]}</b> <span class='k'>${v[k]?(v[k]===1?'Verified':v[k]):T[k][1]}</span>${k==cur?F[k]+`<div class='row'><button class='btn' data-a='vf' data-v='${k}'>Verify ${T[k][0]}</button></div>`:''}</div></div>`).join('')}<div class='row'><button class='btn o' data-a='autov'>Fill all with sample data (demo)</button></div><div class='k' style='margin-top:8px'>Demo only: never enter real Aadhaar or PAN numbers. In production, Aadhaar goes through a licensed eKYC partner or DigiLocker, and Deadline keeps only a reference token and the last 4 digits. One PAN or Aadhaar can verify one account only.</div></div>`}
function profile(){const a=me(),m=dims('provider'),c=Object.keys(S.net.con),rg=new Set(c.map(h=>NP.find(x=>x[1]==h)[2]).concat(a.region)),done=S.cs.flatMap(k=>k.ms.filter(x=>FIN.includes(x.s)).map(x=>x.n)),tl=done.concat(['Brand identity (sample)','Landing page (sample)','Pitch deck (sample)','Product shoot (sample)','Launch video (sample)']).slice(0,6),L=lv(a);
return`<div class='g2'><div><div class='card' style='margin-bottom:12px'><div class='row' style='margin:0'>${av(a.name,72)}<div style='flex:1'><h2>${esc(a.name)} <span class='pill ${L[1]}'>${L[0]}</span></h2><div class='k'>@${a.handle} · ${a.uid}</div><div class='k'>${a.type} · ${esc(a.region)} · deadline.id/${a.handle}</div></div></div><p>${esc(a.bio)||'<span class="k">Add a short bio so people know what you do.</span>'}</p>${a.skills?`<div class='row'>${a.skills.split(',').map(s=>`<span class='pill i'>${esc(s.trim())}</span>`).join('')}</div>`:''}<div class='row'>${badges(a)}</div><div class='g' style='grid-template-columns:repeat(4,1fr);margin:14px 0 0;text-align:center'>${[[tot(m.d).toFixed(0),'Trust'],[m.n,'Contracts'],[c.length,'Network'],[rg.size,'Regions']].map(x=>`<div><div class='v'>${x[0]}</div><div class='k'>${x[1]}</div></div>`).join('')}</div></div>
<div class='card'><h3>Verified work</h3><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:6px'>${tl.map((x,i)=>`<div style='aspect-ratio:1;border-radius:14px;background:linear-gradient(${i*55}deg,var(--pri),var(--pri2) 60%,var(--acc));color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px'><b>${esc(x)}</b>✓ Verified delivery</div>`).join('')}</div><div class='k' style='margin-top:8px'>Amounts and client names stay private unless you choose to share them.</div></div></div>
<div>${verCard(a)}<div class='card' style='margin:12px 0'><h3>Edit public profile</h3><label>Bio</label><input data-f='au.bio' maxlength='160' value="${esc(AU.bio??a.bio)}"><label>Skills (comma separated)</label><input data-f='au.skills' value="${esc(AU.skills??a.skills)}"><div class='row'><button class='btn' data-a='savep'>Save profile</button></div></div>
<div class='card'><h3>Accounts on this device (${DV.o.length} of 3)</h3>${DV.o.map(u=>{const x=DV.a[u];return`<div class='row'><span style='flex:1'><b>${esc(x.name)}</b><div class='k'>@${x.handle} · ${x.uid}</div></span>${u==DV.cur?'<span class="pill ok">Active</span>':`<button class='btn o' data-a='swap' data-v='${u}'>Switch</button>`}</div>`}).join('')}<div class='row'><button class='btn o' data-a='add' ${DV.o.length>=3?'disabled':''}>Add account</button><button class='btn r' data-a='out'>Log out</button></div>${DV.o.length>=3?'<div class="k">Device limit reached. Log in to an existing account instead.</div>':''}</div></div></div>`}
function network(){const r=AU.rg||'All',c=S.net.con,L=NP.filter(p=>(r=='All'||p[2]==r)&&(!AU.vo||p[7]>=2)),rc={};Object.keys(c).forEach(h=>{const p=NP.find(x=>x[1]==h);rc[p[2]]=(rc[p[2]]||0)+1});
return`<div class='card' style='margin-bottom:12px'><h2>Your network</h2><div class='k'>${Object.keys(c).length} connections across ${Object.keys(rc).length} regions. Home region: ${esc(me().region)}</div>${Object.keys(rc).map(g=>`<div class='tr' style='grid-template-columns:110px 1fr 24px'><span>${g}</span><div class='bar'><b style='width:${Math.min(100,rc[g]*34)}%'></b></div><b>${rc[g]}</b></div>`).join('')||'<p class="k">Connect with trusted providers and clients in other regions to grow your network.</p>'}</div><div class='row' style='margin:0 0 10px'>${['All',...RG].map(g=>`<button class='pill ${g==r?'ok':''}' style='border:0;cursor:pointer;padding:6px 12px' data-a='rg' data-v='${g}'>${g}</button>`).join('')}<button class='pill ${AU.vo?'ok':''}' style='border:0;cursor:pointer;padding:6px 12px' data-a='vo'>${AU.vo?'✓ ':''}Verified only</button></div>
<div class='g2'>${L.map(p=>{const h=p[1],st=c[h]?'Connected ✓':S.net.req[h]?'Requested…':'Connect';return`<div class='card'><div class='row' style='margin:0'>${av(p[0],48)}<div style='flex:1'><b>${p[0]}</b> ${p[7]>=2?'<span class="pill ok">Verified</span>':'<span class="pill w">Basic</span>'}<div class='k'>${p[3]} · ${p[2]} · @${h}</div></div></div><p class='k'>${p[4]}</p><div class='row'><span class='pill i'>Trust ${p[5]}</span><span class='pill'>${p[6]} contracts</span><span class='pill'>${parseInt(hs(h+me().uid),16)%9} mutual</span></div><div class='row'><button class='btn ${c[h]?'o':''}' data-a='con' data-v='${h}' ${c[h]||S.net.req[h]?'disabled':''}>${st}</button></div></div>`}).join('')||'<p class="k">No profiles in this region yet.</p>'}</div>`}
function toast(t){const e=$('#ts');e.textContent=t;e.style.opacity=1;clearTimeout(window._t);window._t=setTimeout(()=>e.style.opacity=0,2400)}
function flowCard(){return`<div class="card" style="margin-bottom:12px"><h2>Money flow</h2><div class="k">Where each milestone’s money sits right now</div>${S.cs.filter(c=>c.st!='awaiting').flatMap(c=>c.ms.map(m=>{const f=FIN.includes(m.s),h=m.s!='planned'&&!f;return`<div class="tr" style="grid-template-columns:150px 1fr 60px"><span>${esc(m.n)}</span><div class="bar"><b style="width:${f||h?100:0}%;background:${f?'var(--ok)':m.s=='disputed'?'var(--bad)':'var(--pri2)'}"></b></div><b>${f?'Paid':h?'Held':'Open'}</b></div>`})).join('')}</div>`}
function modal(){const x=S.md;if(!x)return'';const m=S.cs[x.c].ms[x.m],op=(a,v,t,on)=>`<button class="op ${on?'on':''}" data-a="${a}" data-v="${v}">${on?'✓':'○'} ${t}</button>`;let b='';
if(x.k=='pay')b=`<h2>Secure ${inr(m.a)}</h2><div class="k">Held by an authorised banking partner until you approve. It is not Deadline’s money.</div><div class="row">${['UPI','Net banking','Card'].map(t=>`<button class="pill ${x.mt==t?'ok':''}" style="border:0;cursor:pointer;padding:8px 14px" data-a="mt" data-v="${t}">${t}</button>`).join('')}</div><p class="k">${x.mt=='UPI'?'Pay to partner VPA deadline.escrow@partner (demo)':x.mt=='Card'?'•••• •••• •••• 4417 (demo)':'Choose your bank (demo)'}</p><div class="row"><button class="btn a" data-a="go" ${x.busy?'disabled':''}>${x.busy?'Processing…':'Pay '+inr(m.a)}</button><button class="btn o" data-a="cx">Cancel</button></div>`;
if(x.k=='ev')b=`<h2>Attach evidence</h2><div class="k">Each item is time-stamped and fingerprinted so it can’t be edited later.</div><div style="margin-top:10px">${['Files & screenshots','Staging or source link','Chat or email approvals','Time-stamped work log'].map(t=>op('evt',t,t,x.e[t])).join('')}</div><div class="row"><button class="btn" data-a="evgo">Submit for review</button><button class="btn o" data-a="cx">Cancel</button></div>`;
if(x.k=='dis')b=`<h2>Raise a dispute</h2><div class="k">Pick a specific reason. Vague claims don’t pause release.</div><div style="margin-top:10px">${['Work doesn’t match the agreed scope','Deliverable missing or incomplete','Quality below agreed criteria','Other (add details)'].map(t=>op('dr',t,t,x.r==t)).join('')}</div><div class="row"><button class="btn r" data-a="disgo">Open dispute</button><button class="btn o" data-a="cx">Cancel</button></div>`;
return`<div class="mdl" role="dialog" aria-modal="true"><div class="card">${b}</div></div>`}
function verify(){const i=S.vp|0,p=VP[i],t=tot(p.d),cf=p.c>=20?'high':p.c>=8?'medium':'limited',js=JSON.stringify({handle:p.h,identity:'verified',score:Math.round(t),confidence:cf,verified_contracts:p.c,on_time_rate:+(p.d[1]/100).toFixed(2),open_disputes:p.o,expires_in:'7 days'},null,1);
return`<div class="g2"><div class="card"><h2>Verify before you hire</h2><div class="k" style="margin-bottom:10px">Businesses check a provider’s verified record in seconds</div>${VP.map((x,j)=>`<button class="cl ${j==i?'on':''}" data-a="vp" data-v="${j}"><b>${x.n}</b><br><span class="k">${x.r}</span></button>`).join('')}</div><div class="card"><div class="row" style="margin:0"><div class="ring" style="--p:${t.toFixed(0)}"><div>${t.toFixed(0)}</div></div><div><h2>${p.n}</h2><span class="pill ${cf=='limited'?'w':cf=='high'?'ok':'i'}">${cf} confidence</span> ${p.o?'<span class="pill w">1 dispute open</span>':''}<div class="k">${p.c} verified contracts</div></div></div><div style="text-align:center">${radar(p.d)}</div><h3>Deadline Trust API</h3><pre style="background:var(--bg);padding:12px;border-radius:12px;overflow-x:auto;font-size:12px">GET /v1/trust/${p.h}\n${js}</pre><div class="k">The same record can power marketplaces, ERPs and procurement tools through an API, with the person’s consent.</div></div></div>`}
function R(){if(!me()){$('#md').innerHTML='';$('#nav').innerHTML='';$('#rs').innerHTML='';$('#app').innerHTML=auth();return}$('#md').innerHTML=modal();$('#dy').textContent='⏱ Day '+S.day;try{localStorage.setItem(KEY,JSON.stringify({...S,md:null}))}catch(e){}$('#nb').textContent='🔔 '+todo().length;$('#rs').innerHTML=['provider','client'].map(r=>`<button class="${S.role==r?'on':''}" data-a="role" data-v="${r}">${r=='provider'?'Freelancer view':'Client view'}</button>`).join('');
$('#nav').innerHTML=[['home','Home'],['contracts','Contracts'],['trust','Trust ID'],['pay','Payments'],['verify','Verify'],['network','Network'],['profile','Profile']].map(x=>`<button class="${S.tab==x[0]?'on':''}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('');
$('#app').innerHTML=({home,contracts,trust,pay,verify,network,profile})[S.tab]()+(S.tab=='home'?roadmap()+'<div class="row"><button class="btn o" data-a="reset">Reset demo</button></div>':'')}
const $=s=>document.querySelector(s);$('#hl').src='/public/deadline-logo.png';$('#fv').href=MARK;R();
</script></body></html>
